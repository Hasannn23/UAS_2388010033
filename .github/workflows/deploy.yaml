name: Deploy Web Statis to AWS EC2

on:
  push:
    branches: [ main ]
    paths:
      - 'static-web/**'
      - '.github/workflows/deploy.yaml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./static-web
        file: ./static-web/Dockerfile
        push: true
        no-cache: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/uas-statis:latest

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    name: Deploy to EC2 via SSH and run docker compose
    steps:
    - name: SSH and deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USERNAME }}
        key: ${{ secrets.AWS_PRIVATE_KEY }}
        port: 22
        script: |
          # Locate repository or clone if it does not exist
          STATIC_DIR=$(find ~ /var/www /home -name "static-web" -type d 2>/dev/null | head -n 1)
          if [ -z "$STATIC_DIR" ]; then
            echo "Repository not found. Cloning to ~/UAS_2388010033..."
            git clone https://github.com/Hasannn23/UAS_2388010033.git ~/UAS_2388010033
            REPO_DIR="$HOME/UAS_2388010033"
          else
            REPO_DIR=$(dirname "$STATIC_DIR")
          fi
          cd "$REPO_DIR"
          echo "Deploying Static Web in directory: $(pwd)"

          # Update Git repository using proven clean reset
          git fetch origin main
          git reset --hard origin/main

          # Pull latest docker image
          echo "Pulling latest static-web image..."
          sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/uas-statis:latest

          # Recreate static-web container
          echo "Restarting static-web container..."
          sudo docker rm -f uas-statis || true
          sudo DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} AWS_HOST=${{ secrets.AWS_HOST }} docker compose up -d --force-recreate static-web

          # Clean up old images
          sudo docker image prune -f
          
          echo "=== Container Status ==="
          sudo docker ps